# Temporary, package-scoped exception for the upstream PostgreSQL image's
# embedded gosu binary. gosu's maintainers document that generic Go stdlib
# scanners report APIs the binary does not call; re-evaluate after expiry and
# when the base image/gosu binary changes. This is not a general CVE waiver.
vulnerabilities:
  - id: CVE-2025-68121
    purls: ["pkg:golang/stdlib@v1.24.6"]
    expired_at: 2027-02-04
    statement: "Upstream gosu security policy classifies generic stdlib findings as potentially unreachable; scoped to the embedded gosu component and expires for re-review."
