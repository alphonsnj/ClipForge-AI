name: clipforge-hosted

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?set a URL-encoded PostgreSQL URL}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_BASE_URL: https://${CLIPFORGE_HOSTNAME:?set the public hostname}
  CORS_ORIGINS: https://${CLIPFORGE_HOSTNAME:?set the public hostname}
  AUTH_COOKIE_SECURE: "true"
  LOGIN_RATE_LIMIT_HASH_KEY: ${LOGIN_RATE_LIMIT_HASH_KEY:?set a unique random secret of at least 32 characters}
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?set the actual reverse-proxy peer IP or CIDR}
  MEDIA_STORAGE_DIR: /var/lib/clipforge/media
  RENDER_STORAGE_DIR: /var/lib/clipforge/outputs
  MODEL_CACHE_DIR: /var/lib/clipforge/models
  SOURCE_RETENTION_DAYS: ${SOURCE_RETENTION_DAYS:-7}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
  MAX_MEDIA_STORAGE_BYTES: ${MAX_MEDIA_STORAGE_BYTES:-2147483648}
  MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-3600}
  MAX_RENDER_STORAGE_BYTES: ${MAX_RENDER_STORAGE_BYTES:-2147483648}
  MAX_RENDER_FILE_BYTES: ${MAX_RENDER_FILE_BYTES:-524288000}
  MAX_RENDER_DURATION_SECONDS: ${MAX_RENDER_DURATION_SECONDS:-180}
  RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-900}

services:
  postgres:
    image: clipforge-postgres:16-alpine
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a unique PostgreSQL password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [private]
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1}
          memory: ${REDIS_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [maintenance]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/var/lib/clipforge
    networks: [edge, private]
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-1}
          memory: ${API_MEMORY_LIMIT:-1G}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    volumes:
      - media_data:/var/lib/clipforge
    networks: [private]
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-4}
          memory: ${WORKER_MEMORY_LIMIT:-6G}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 2m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-1}
          memory: ${FRONTEND_MEMORY_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  private:
    driver: bridge
    internal: true
