name: ClipForge CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend

  backend:
    name: Backend syntax and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m compileall -q backend/app backend/alembic/versions
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r backend/requirements.txt

  infrastructure:
    name: Compose image vulnerability scan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:16-alpine", "redis:7-alpine"]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
